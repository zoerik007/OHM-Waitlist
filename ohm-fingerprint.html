<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C = {
  ink:      '#1A1714',
  cream:    '#F5F0E8',
  deep:     '#EDE6D8',
  forest:   '#5A6B53',
  sage:     '#97B886',
  gold:     '#C4973A',
};

const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');

// Resize to fill container
function resize() {
  canvas.width  = canvas.offsetWidth  * devicePixelRatio;
  canvas.height = canvas.offsetHeight * devicePixelRatio;
}
resize();
window.addEventListener('resize', resize);

// ── Ridge geometry (translated from JSX) ────────────────────────────
function ridgePaths(count) {
  const paths = [];
  for (let i = 0; i < count; i++) {
    const a     = 30 + i * (250 / count);
    const b     = 40 + i * (300 / count);
    const cy    = -38 + i * 3.2;
    const closed = i < 3;
    const gap   = (closed ? 0 : 15 + (i - 3) * 2.1) * Math.PI / 180;
    const start = Math.PI / 2 + gap;
    const end   = Math.PI * 2.5 - gap;
    const steps = 130;
    const pts   = [];

    for (let s = 0; s <= steps; s++) {
      const th  = start + (end - start) * (s / steps);
      const wob = 1
        + 0.022 * Math.sin(3 * th + i * 0.72)
        + 0.014 * Math.sin(5 * th - i * 0.45)
        + 0.010 * Math.sin(2 * th + i * 1.3);
      pts.push([a * wob * Math.cos(th), cy + b * wob * Math.sin(th)]);
    }

    if (!closed) {
      const tail = (p, q, len) => {
        const dx = p[0] - q[0], dy = p[1] - q[1];
        const m  = Math.hypot(dx, dy) || 1;
        return [p[0] + (dx / m) * len, p[1] + (dy / m) * len];
      };
      const len = 34 + (i - 3) * 11;
      pts.unshift(tail(pts[0], pts[1], len));
      pts.push(tail(pts[pts.length - 1], pts[pts.length - 2], len));
    }
    paths.push(pts);
  }
  return paths;
}

const COUNT = 14;
const PATHS = ridgePaths(COUNT);

// ── Easing functions ────────────────────────────────────────────────
const ease = {
  linear:        t => t,
  easeInOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
  easeOutCubic:  t => 1 - Math.pow(1 - t, 3),
  easeInQuad:    t => t * t,
  easeOutBack:   t => { const c1=1.70158, c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
};

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function anim({ from, to, start, end, fn }) {
  return t => {
    if (t <= start) return from;
    if (t >= end)   return to;
    const p = (t - start) / (end - start);
    return from + (to - from) * (fn ? fn(p) : p);
  };
}

// ── Scene timing (seconds) ──────────────────────────────────────────
// Trace: 0 → 2.2, Scan: 2.2 → 4.6, Verify: 4.6 → 6.0, loop
const TOTAL = 6.8;
const CUES  = { Trace: 0, Scan: 2.3, Verify: 4.65 };

// ── Draw helpers ────────────────────────────────────────────────────
function drawRidge(ctx, pts, progress, color, strokeW) {
  if (progress <= 0) return;
  const end = Math.floor(pts.length * clamp(progress, 0, 1));
  if (end < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < end - 1; k++) {
    const mx = (pts[k][0] + pts[k+1][0]) / 2;
    const my = (pts[k][1] + pts[k+1][1]) / 2;
    ctx.quadraticCurveTo(pts[k][0], pts[k][1], mx, my);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth   = strokeW;
  ctx.lineCap     = 'round';
  ctx.stroke();
}

// ── Main render ──────────────────────────────────────────────────────
let startTime = null;

function render(ts) {
  if (!startTime) startTime = ts;
  const elapsed = (ts - startTime) / 1000;
  const T = elapsed % TOTAL;

  const W = canvas.width;
  const H = canvas.height;
  const dpr = devicePixelRatio;
  const cx  = W / 2;
  const cy  = H / 2;

  // Scale: fit fingerprint into canvas
  const scale = Math.min(W, H) / 900 * dpr;
  const strokeW = (250 / COUNT) * 0.40;

  ctx.clearRect(0, 0, W, H);

  // No background fill — transparent canvas for overlay use
  const zoom  = anim({ from: 1.0, to: 1.075, start: 0, end: TOTAL, fn: ease.linear })(T);
  const drift = anim({ from: 8, to: -8, start: 0, end: TOTAL, fn: ease.easeInOutSine })(T);

  ctx.save();
  ctx.translate(cx + drift * scale, cy + drift * 0.4 * scale);
  ctx.scale(zoom * scale, zoom * scale);

  // Clipping ellipse (fingertip shape)
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 10, 278, 330, 0, 0, Math.PI * 2);
  ctx.clip();

  // ── Trace phase ──────────────────────────────────────────
  const traceEnd = CUES.Scan;
  const maxPerRidge = 1.05 / Math.max(COUNT - 1, 1);

  // Scan progress
  const scanP  = anim({ from: 0, to: 1, start: CUES.Scan + 0.15, end: CUES.Scan + 1.95, fn: ease.easeInOutSine })(T);
  const scanY  = -330 + scanP * 690;
  const barOn  = anim({ from: 0, to: 1, start: CUES.Scan, end: CUES.Scan + 0.25, fn: ease.easeOutCubic })(T)
               * anim({ from: 1, to: 0, start: CUES.Scan + 1.9, end: CUES.Scan + 2.15, fn: ease.easeOutCubic })(T);

  // Verify
  const settle   = anim({ from: 0, to: 1, start: CUES.Verify - 0.15, end: CUES.Verify + 0.55, fn: ease.easeOutCubic })(T);
  const checkPop = anim({ from: 0, to: 1, start: CUES.Verify - 0.05, end: CUES.Verify + 0.5, fn: ease.easeOutBack })(T);
  const checkDraw= anim({ from: 0, to: 1, start: CUES.Verify + 0.18, end: CUES.Verify + 0.62, fn: ease.easeInOutSine })(T);
  const ringDraw = anim({ from: 0, to: 1, start: CUES.Verify - 0.1, end: CUES.Verify + 0.55, fn: ease.easeInOutSine })(T);
  const out      = anim({ from: 1, to: 0, start: TOTAL - 0.4, end: TOTAL, fn: ease.easeInQuad })(T);

  ctx.globalAlpha = out;
  ctx.save();
  ctx.scale(1 - settle * 0.05, 1 - settle * 0.05);

  // Unscanned ridges (sage)
  ctx.globalAlpha = out * (1 - settle * 0.6);
  for (let i = 0; i < COUNT; i++) {
    const rStart = CUES.Trace + 0.12 + i * maxPerRidge;
    const rEnd   = CUES.Trace + 1.05 + i * maxPerRidge;
    const on     = anim({ from: 0, to: 1, start: rStart, end: rEnd, fn: ease.easeInOutSine })(T);
    drawRidge(ctx, PATHS[i], on, C.sage, strokeW);
  }

  // Scanned ridges (forest green) — only below scanY
  ctx.save();
  ctx.beginPath();
  ctx.rect(-420, -360, 840, Math.max(0, scanY + 360));
  ctx.clip();
  ctx.globalAlpha = out * (1 - settle * 0.45);
  for (let i = 0; i < COUNT; i++) {
    const rStart = CUES.Trace + 0.12 + i * maxPerRidge;
    const rEnd   = CUES.Trace + 1.05 + i * maxPerRidge;
    const on     = anim({ from: 0, to: 1, start: rStart, end: rEnd, fn: ease.easeInOutSine })(T);
    drawRidge(ctx, PATHS[i], on, C.forest, strokeW);
  }
  ctx.restore();

  // Scan bar
  if (barOn > 0.01) {
    ctx.globalAlpha = out * barOn;
    // Trail gradient
    const grad = ctx.createLinearGradient(0, scanY - 120, 0, scanY);
    grad.addColorStop(0, 'rgba(196,151,58,0)');
    grad.addColorStop(1, 'rgba(196,151,58,0.22)');
    ctx.fillStyle = grad;
    ctx.fillRect(-300, scanY - 120, 600, 120);
    // Bar
    ctx.fillStyle = C.gold;
    ctx.beginPath();
    ctx.roundRect(-300, scanY - 2.5, 600, 5, 2.5);
    ctx.fill();
    // Glow
    ctx.fillStyle = 'rgba(196,151,58,0.28)';
    ctx.beginPath();
    ctx.roundRect(-300, scanY - 9, 600, 18, 9);
    ctx.fill();
  }

  ctx.restore(); // scale for settle
  ctx.restore(); // clip

  // ── Verify checkmark ───────────────────────────────────────────
  if (checkPop > 0.01) {
    const popScale = 0.6 + checkPop * 0.4;
    ctx.save();
    ctx.translate(0, 8);
    ctx.scale(popScale, popScale);
    ctx.globalAlpha = clamp(checkPop, 0, 1);

    // White circle
    ctx.beginPath();
    ctx.arc(0, 0, 112, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(245,240,232,0.15)';
    ctx.fill();

    // Gold ring (drawn progressively)
    if (ringDraw > 0.01) {
      ctx.beginPath();
      ctx.arc(0, 0, 112, -Math.PI / 2, -Math.PI / 2 + ringDraw * Math.PI * 2);
      ctx.strokeStyle = C.gold;
      ctx.lineWidth   = 4;
      ctx.stroke();
    }

    // Forest circle
    ctx.beginPath();
    ctx.arc(0, 0, 86, 0, Math.PI * 2);
    ctx.fillStyle = C.forest;
    ctx.fill();

    // Checkmark (drawn progressively)
    if (checkDraw > 0.01) {
      const pts = [[-38, 2], [-12, 30], [40, -28]];
      const totalLen = 0 + Math.hypot(pts[1][0]-pts[0][0], pts[1][1]-pts[0][1])
                         + Math.hypot(pts[2][0]-pts[1][0], pts[2][1]-pts[1][1]);
      const seg1 = Math.hypot(pts[1][0]-pts[0][0], pts[1][1]-pts[0][1]) / totalLen;
      ctx.beginPath();
      ctx.strokeStyle = C.cream;
      ctx.lineWidth   = 12;
      ctx.lineCap     = 'round';
      ctx.lineJoin    = 'round';
      if (checkDraw <= seg1) {
        const p = checkDraw / seg1;
        ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.lineTo(pts[0][0] + (pts[1][0]-pts[0][0])*p, pts[0][1] + (pts[1][1]-pts[0][1])*p);
      } else {
        const p = (checkDraw - seg1) / (1 - seg1);
        ctx.moveTo(pts[0][0], pts[0][1]);
        ctx.lineTo(pts[1][0], pts[1][1]);
        ctx.lineTo(pts[1][0] + (pts[2][0]-pts[1][0])*p, pts[1][1] + (pts[2][1]-pts[1][1])*p);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  ctx.restore(); // main transform

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
